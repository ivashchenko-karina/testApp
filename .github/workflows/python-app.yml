name: Python application

on:
  push:
    branches: ["lab7-8"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Lab7-8/requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 Lab7-8 --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 Lab7-8 --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        run: python -m unittest discover -s Lab7-8 -p "app_tests.py"
