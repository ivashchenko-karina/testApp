name: Python application

on:
  push:
    branches: ["lab7-8"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Lab7-8/requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 Lab7-8 --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 Lab7-8 --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        run: python -m unittest discover -s Lab7-8 -p "app_tests.py"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.0.1
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check
        working-directory: Lab7-8/terraform
        continue-on-error: true

      - name: Terraform Init
        run: terraform init
        working-directory: Lab7-8/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: Lab7-8/terraform

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -refresh=true
        working-directory: Lab7-8/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
        working-directory: Lab7-8/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}